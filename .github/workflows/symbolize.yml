name: symbolize
on:
  workflow_dispatch:
    inputs:
      addrs:
        description: space separated addresses
        default: "0x211591ad0 0x220a88140 0x1d0c097b8 0x1d0b70bc0 0x1d0c36238 0x1d0b5fbb8 0x1d0b5fb20 0x23fb78c64 0x1dcccf0f4 0x23fb78bf4 0x1d0c36238 0x1dcb18780 0x1dcafaa50 0x23fb77af4 0x211591030 0x2115a2b18 0x2115a2db8 0x211591524 0x1d5ddc148 0x1d5ddd2e0 0x1d5de1d20 0x1009b7e40 0x1f35a4344"
      slides:
        description: candidate slides (space separated)
        default: "0x4ef80000 0x0"

jobs:
  sym:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip gh jq

      - name: ipsw tool
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo blacktop/ipsw --pattern '*linux_x86_64.tar.gz' --dir t --clobber
          tar -xzf t/*linux_x86_64.tar.gz -C t
          find t -name ipsw -type f | head
          ./t/ipsw version || true

      - name: download + extract dyld cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./t/ipsw download ipsw --device iPhone10,3 --version 16.7.16 -y 2>&1 | tail -5
          ls -l *.ipsw
          ./t/ipsw extract --dyld --dyld-arch arm64 -o dsc *.ipsw 2>&1 | tail -10
          find dsc -name 'dyld_shared_cache*' | head

      - name: symbolize
        run: |
          DSC=$(find dsc -name 'dyld_shared_cache_arm64' | head -1)
          echo "cache $DSC"; ls -l "$DSC"
          : > syms.txt
          for a in ${{ inputs.addrs }}; do
            for s in ${{ inputs.slides }}; do
              u=$(python3 -c "print(hex(int('$a',16)-int('$s',16)))")
              out=$(./t/ipsw dyld a2s "$DSC" "$u" 2>&1 | head -4 | tr '\n' ' ')
              echo "$a slide=$s unslid=$u -> $out" >> syms.txt
            done
          done
          cat syms.txt

      - uses: actions/upload-artifact@v4
        with:
          name: symbols
          path: syms.txt
          if-no-files-found: error
