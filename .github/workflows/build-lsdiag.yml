name: build-lsdiag
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: compile for iOS 16 arm64
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          xcrun -sdk iphoneos clang -target arm64-apple-ios16.0 -isysroot "$SDK" -O2 -Wall -o pandora-lsdiag tools/pandora-lsdiag.c
          file pandora-lsdiag || true
          ls -l pandora-lsdiag
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pandora-lsdiag-${{ matrix.os }}
          path: pandora-lsdiag